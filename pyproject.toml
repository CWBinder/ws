[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ws-workspace-cli"
version = "0.1.0"
description = "A local workspace for projects, documents, literature and the relationships between them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ws = "ws_lib.entrypoint:main"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["ws_lib*"]

[tool.setuptools.data-files]
"share/ws" = ["README.md", "GETTING-STARTED.md", "AGENTS.md", "SKILL.md"]
"share/ws/contracts" = ["contracts/*.md"]
"share/ws/templates" = ["templates/*"]
"share/ws/help" = ["help/*.md"]
"share/ws/help/add" = ["help/add/*.md"]
"share/ws/help/create" = ["help/create/*.md"]
"share/ws/help/projects" = ["help/projects/*.md"]
"share/ws/help/rebuild" = ["help/rebuild/*.md"]
"share/ws/context/whereami" = ["context/whereami/*.md"]
"share/ws/context/instructions" = ["context/instructions/*.md"]
